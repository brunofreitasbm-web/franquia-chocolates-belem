[build]
  publish = "."
  command = ""

# Link curto para usar no link da bio do Instagram, no lugar da URL longa
# com utm_source/utm_medium/utm_content. status = 200 é um rewrite (proxy):
# o conteúdo com os parâmetros de rastreamento é servido por trás, mas a
# barra de endereço continua mostrando /ig — inclusive se a pessoa copiar
# ou repassar o link depois de abrir a página.
[[redirects]]
  from = "/ig"
  to = "/?utm_source=ig&utm_medium=social&utm_content=link_in_bio"
  status = 200
  force = true

# Arquivos de trabalho que o publish = "." deixaria públicos e indexáveis:
# rascunho do template (duplicata da página), documentação/estratégia e ferramentas.
# Respondem 404 para o buscador tirá-los do índice.
[[redirects]]
  from = "/scratch_s4.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dna-oferta.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/documentacao-landing-page.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# CSS/JS legados e exports de design na raiz: não são usados pela página
# e não devem aparecer em busca de imagens/arquivos.
[[headers]]
  for = "/css/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/js/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*@2x.png"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
